<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Splendor Music</title>
<meta name="description" content="Listen, collect and share music NFTs on the XPR Network. Mint on Vibrr, listen and share on Splendor Music.">
<meta name="theme-color" content="#060607">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Splendor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="preload" href="fonts/cenotaph-titling.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="style.css?v=0.8.0">
</head>
<body>
<div id="ambient" aria-hidden="true"></div>
<header class="top">
  <button id="back-btn" class="back-btn" hidden title="Back"><span class="chev">&#8249;</span><span class="lbl">Back</span></button>
  <a class="brand" href="#/" data-nav="home"><img class="s-mark" src="icons/s-mark.png" alt=""><span class="wordmark">Splendor <small>Music</small></span></a>
  <nav class="topnav">
    <a href="#/" data-nav="home">Discover</a>
    <a href="#/radio" data-nav="radio">Radio</a>
    <a href="#/playlists" data-nav="playlists">Playlists</a>
    <a href="#/artists" data-nav="artists">Artists</a>
    <a href="#/library" data-nav="library">Library</a>
  </nav>
  <input id="search" type="search" placeholder="Search songs, releases, artists" autocomplete="off">
  <button id="install-btn" class="btn sm" hidden title="Install Splendor Music as an app">Install app</button>
  <button id="me-btn" class="me-chip empty" title="Your XPR account">Sign in</button>
</header>

<main id="view"><div class="loading"><img class="load-logo" src="img/splendor-lockup.png" alt="Splendor">Reading music from the XPR Network…</div></main>

<footer class="player" id="player">
  <button id="p-open" class="p-open" title="Open Now Playing"><img id="p-art" alt=""></button>
  <div class="p-meta"><a id="p-title" href="#/">Nothing playing</a><div id="p-artist" class="muted">Pick a release or a radio station</div></div>
  <div class="p-side">
    <button id="p-like" class="ic like" title="Like">&#9829;</button>
    <button id="p-save" class="ic" title="Save to playlist">+</button>
    <a id="p-pass" class="ic pass" href="#/" title="Music Passport">Passport</a>
    <button id="p-collect" class="btn sm" hidden>Collect</button>
  </div>
  <div class="p-ctrl">
    <button id="p-prev" title="Previous">&#9198;</button>
    <button id="p-play" class="big" title="Play">&#9654;</button>
    <button id="p-next" title="Next">&#9197;</button>
  </div>
  <div class="p-bar"><span id="p-cur">0:00</span><input id="p-seek" type="range" min="0" max="1000" value="0"><span id="p-dur">0:00</span></div>
  <input id="p-vol" type="range" min="0" max="100" value="85" title="Volume">
  <audio id="audio" preload="none"></audio>
</footer>

<!-- Now Playing: full-screen player (tap the artwork; Back or the arrow closes it) -->
<div id="np" class="np" hidden>
  <div class="np-bg" id="np-bg"></div>
  <div class="np-in">
    <div class="np-top"><button id="np-close" class="np-x" title="Close">&#8964;</button><span class="np-ctx" id="np-ctx">Now playing</span><a id="np-pass" class="ic pass" href="#/">Passport</a></div>
    <div class="np-main">
      <img id="np-art" class="np-art" alt="">
      <div class="np-side">
        <div class="np-meta"><a id="np-title" href="#/">Nothing playing</a><a id="np-artist" class="muted" href="#/"></a></div>
        <div class="np-bar"><input id="np-seek" type="range" min="0" max="1000" value="0"><div class="np-times"><span id="np-cur">0:00</span><span id="np-dur">0:00</span></div></div>
        <div class="np-ctrl">
          <button id="np-like" class="ic like" title="Like">&#9829;</button>
          <button id="np-prev" title="Previous">&#9198;</button>
          <button id="np-play" class="big" title="Play">&#9654;</button>
          <button id="np-next" title="Next">&#9197;</button>
          <button id="np-save" class="ic" title="Save to playlist">+</button>
        </div>
        <div class="np-q"><div class="np-tabs"><button class="on" data-npv="queue">Up next</button><button data-npv="lyrics">Lyrics</button></div><div id="np-queue"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- phones: app-style tab bar -->
<nav class="tabbar" id="tabbar">
  <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span>Discover</span></a>
  <a href="#/radio" data-nav="radio"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.2"/><path d="M7.8 16.2a6 6 0 0 1 0-8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 19a10 10 0 0 1 0-14M19 5a10 10 0 0 1 0 14" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg><span>Radio</span></a>
  <a href="#/playlists" data-nav="playlists"><svg viewBox="0 0 24 24"><path d="M4 6h11M4 11h11M4 16h7" fill="none" stroke-width="2" stroke-linecap="round"/><path d="M17 8.5v8.2a2.3 2.3 0 1 1-1.6-2.2V6.5l4.6-1.3v2.1z"/></svg><span>Playlists</span></a>
  <a href="#/artists" data-nav="artists"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="3.7"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0z"/></svg><span>Artists</span></a>
  <a href="#/library" data-nav="library"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="3.2" height="16" rx="1"/><rect x="9.4" y="4" width="3.2" height="16" rx="1"/><path d="m15.2 4.9 3-.8 3.4 15.4-3 .8z"/></svg><span>Library</span></a>
</nav>

<script src="profiles.js?v=0.8.0"></script>
<script src="app.js?v=0.8.0"></script>
<script src="wallet.js?v=0.8.0"></script>
<script src="radio.js?v=0.8.0"></script>
</body>
</html>
